name: Build and release Decky ZIP
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: decky-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:ui
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/prepare_runtime.py
      - run: python3 scripts/smoke.py
      - run: python3 scripts/package.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: decky-codex-installation
          path: |
            out/Decky Codex.zip
            out/SHA256SUMS
            out/build.json
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-protocol-schemas
          path: schemas/generated/
          if-no-files-found: error
  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: decky-codex-installation
          path: release
      - name: Publish verified preview ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          cd release
          sha256sum -c SHA256SUMS
          TAG="v0.1.0-preview.${RUN_NUMBER}"
          cat > notes.md <<'EOF'
          Installierbare Vorschau von Decky Codex für Steam Deck (Linux x86_64).

          Das Asset **Decky Codex.zip** herunterladen und in Decky unter Entwickleroptionen aus ZIP installieren. Nicht „Source code (zip)“ verwenden.

          Enthält native Codex-Runtime 0.163.0, ChatGPT-Gerätecode-Anmeldung, formatierten Chat, Aktivitätspanel, Auswahlfragen, Installer-Sitzungen, Speicheranalyse sowie explizite Root-Aufträge mit lokalem Passwortdialog.

          Build, Backendtests, Paketprüfung und echter lokaler Codex-Protokolltest sind automatisiert. Die Anmeldung mit einem echten Konto sowie Gaming-Modus, Controller und sudo/PAM auf einem echten Steam Deck benötigen noch eine Prüfung am Gerät. GUI-Installer können manuelle Schritte erfordern. Tarifzugriff und Kontingente hängen vom angemeldeten Konto ab.
          EOF
          gh release create "$TAG" "Decky Codex.zip" SHA256SUMS build.json --repo "$GH_REPO" --target "$COMMIT" --prerelease --title "Decky Codex ${TAG}" --notes-file notes.md
